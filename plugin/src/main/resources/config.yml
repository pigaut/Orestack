# The hologram plugin used to create holograms (DecentHolograms, FancyHolograms)
preferred-hologram-provider: FancyHolograms

# The default hologram view distance, can be overridden inside individual holograms
hologram-view-distance: 15

# Define custom hologram styles and reuse them anywhere. [1.19.4+ only]
hologram-styles:
  default:
    view-distance: 15
    see-through: false # See hologram through blocks
    billboard: center # fixed, vertical, horizontal, center
    alignment: center # center, left, right
    brightness: none # from 0 to 15
    scale: x=1 y=1 z=1
    shadow: none #strength=1 radius=1
#   background-color: { red: 0, green: 0, blue: 0 } # [Text-only]
#   update: 3s   # [Text-only]


