# Stat shortcuts, can be used in any config file
stats-config-shortcuts:
  $heart: ❤
  $speed: ✦
  $protection: ❈
  $wisdom: ✎
  $power: ❁
  $skull: ☠
  $ferocity: ⫽
  $arthropod: Ж
  $undead: ༕
  $ender: ⊙
  $shield: 🛡
  $bone: 🦴
  $bolt: ⚡
  $droplet: 💧
  $clover: ☘
  $balance: ☯
  $passive: ☮
  $soul: ⸎
  $flower: ✿

# Whether to use the actionbar to show the status bar (health, defense, mana)
show-status-bar: true

# The status bar to show to the player
status-bar: '&c{player_health}/{player_max_health}$health     &a{player_defense}$defense     &b{player_mana}/{player_max_mana}$mana  '

# Whether action bar messages should be inserted into the status bar. Otherwise, the message will replace the status bar.
insert-messages-in-status-bar: true

# Settings for status bar messages
status-bar-messages:
  length: 18
  duration: 3s
  align: center   # left, center, right

# The base player stats
base-stats:
  damage: 1
  defense: 1
  max-health: 100
  max-mana: 100
  health-regen: 3
  mana-regen: 2
  crit-damage: 150%
  crit-chance: 15%
  exp-gain: 100%
  mining_fortune: 0
  farming_fortune: 0
  foraging_fortune: 0
  movement_speed: 0
  attack_speed: 0
  mining_speed: 0

# The custom player stats
custom-stats:
  strength:
    base: 0 # The base level
    stats: # Custom stats work by incrementing other base stats
      damage: +1 every 5 levels
      defense: +1 every 5 levels
      crit-damage: +1% every 5 levels
      crit-chance: +0.1% every 1 level

  intelligence:
    base: 0
    stats:
      max-mana: +1 every 1 level
      mana-regen: +1 every 50 levels

  digging_speed:
    base: 0
    stats:
      mining_speed: +1 every 1 level

  chopping_speed:
    base: 0
    stats:
      mining_speed: +1 every 1 level

# Adjust the entity/player damage taken from different causes
# Damage multiplier (vanilla danger) = max-health stat (100) / vanilla health (20)
damage-multipliers:
  entity_attack: 100%
  entity_sweep_attack: 100%
  projectile: 100%
  contact: 500%          # Cactus, berry bush, dripstone
  falling_block: 500%    # Anvils, etc.
  fire: 500%
  fire_tick: 500%
  lava: 500%
  block_explosion: 500%
  entity_explosion: 500%
  thorns: 500%
  hot_floor: 500%
  campfire: 500%
  lightning: 500%
  fly_into_wall: 500%
  cramming: 500%
  freeze: 500%
  sonic_boom: 500%
  magic: 500%
  wither: 500%

