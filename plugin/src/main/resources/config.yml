# Customize whether some enchants should increment stats instead of their vanilla functionality.

# Whether the sharpness enchant should be treated as a stat multiplier.
sharpness-enchant-as-stat: true

# The damage multiplier by sharpness enchant level.
damage-multiplier-by-sharpness-enchant-level:
  1: 105%
  2: 110%
  3: 115%
  4: 120%
  5: 130%
  6: 135%
  7: 140%

# Whether the efficiency enchant should be treated as a stat increment.
efficiency-enchant-as-stat: true

# Set the Mining Speed amount gained by the items efficiency enchant level.
mining-speed-by-efficiency-enchant-level:
  1: +20
  2: +40
  3: +60
  4: +80
  5: +100

# Whether the fortune enchant should be treated as a stat increment.
fortune-enchant-as-stat: true

# Set the Mining Fortune amount gained by the items fortune enchant level.
mining-fortune-by-fortune-enchant-level:
  1: +30
  2: +60
  3: +90
  4: +120


