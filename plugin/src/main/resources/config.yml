# Default lore generation (Useful to avoid writing lore manually)
default-item-lore:
  header: [] # The header before some lore parts
  footer: [''] # The footer after some lore parts
  color: '&7' # The default lore color/format
  parts:
    - '{item_description}' # Headers and footers will be added automatically if configured.
    - '{item_stats}' # Stats, Enchants and abilities use their custom headers, footers, and dividers.
    - '{item_enchants}'
    - '{item_abilities}' # Try adding indentation or characters before/after the placeholder!
    - '{item_rarity}' # The last element will not have a footer
    #- ''

# Settings for the {item_abilities} placeholder
ability-description:
  header: [] # The header before the abilities
  divider: [''] # The divider between abilities
  footer: [''] # The footer after the abilities
  format:
    - '&6Ability: {name} &e&l{trigger}'
    - '&7{description}'
    - '&8Mana Cost: &b{mana_cost}$pencil'

# Settings for the {item_stats} placeholder
stat-descriptions:
  header: [] # The header before the stats
  divider: [] # The divider between stats
  footer: [''] # The footer after the stats
  max-lines: 10
  default: ['&7{stat_name_tc}: &a+{stat_level}']

  # Base stats (stat order is kept as is)
  damage: ['&7Damage: &c+{item_damage}']
  defense: ['&7Defense: &a+{item_defense}']
  max_health: ['&7Health: &a+{item_max_health}']
  max_mana: ['&7Mana: &b+{item_max_mana}']
  health_regen: ['&7Health Regen: &a+{item_health_regen}/2 sec']
  mana_regen: ['&7Mana Regen: &b+{item_mana_regen}/1 sec']
  crit_damage: ['&7Crit Damage: &a+{item_crit_damage}%']
  crit_chance: ['&7Crit Chance: &a+{item_crit_chance}%']
  mining_fortune: ['&7Mining Fortune: &a+{item_mining_fortune}']
  farming_fortune: ['&7Farming Fortune: &a+{item_farming_fortune}']
  foraging_fortune: ['&7Foraging Fortune: &a+{item_foraging_fortune}']
  movement_speed: ['&7Speed: &a+{item_movement_speed}']
  attack_speed: ['&7Attack Speed: &a+{item_attack_speed}']
  mining_speed: ['&7Mining Speed: &a+{item_mining_speed}']
  intelligence: ['&7Intelligence: &a+{item_intelligence}'] # Custom stat
  strength: ['&7Strength: &c+{item_strength}'] # Custom stat


# Settings for the {item_enchants} placeholder
enchant-descriptions:
  header: [] # The header before the enchants
  divider: [''] # The divider between enchants
  footer: [''] # The footer after the enchants
  max-lines: 10 # The lore lines enchants should take up (If surpassed: 1° divider is removed, 2° description is removed, 3° multiple enchants per line)

  # The default enchant description
  default:
    - '&9{enchant_name_tc} {enchant_level_rm}'   # tc: Title Case, rm: Roman Numerals (IV)
  sharpness:
    - '&9Sharpness {enchant_level_rm}'
    - '&7Increases melee damage dealt by &a{item_enchant_damage_%}%'
  efficiency:
    - '&9Efficiency {enchant_level_rm}'
    - '&7Grants &a+{item_enchant_mining_speed} $mining_speed'
  fortune:
    - '&9Fortune {enchant_level_rm}'
    - '&7Grants &a+{item_enchant_mining_fortune} $mining_fortune'
  unbreaking:
    - '&9Unbreaking {enchant_level_rm}'
    - '&7Reduces durability loss'


# The default item rarity.
default-item-rarity: common # Set to 'none' to disable

# Item rarities and values for {item_rarity} placeholder
item-rarities:
  common: '&fCOMMON'
  uncommon: '&aUNCOMMON'
  rare: '&9RARE'
  epic: '&dEPIC'
  legendary: '&6LEGENDARY'


#░░░█░█░█▀█░█░░░█▀█░█▀▀░█▀▄░█▀█░█▄█░█▀▀░░░░
#░░░█▀█░█░█░█░░░█░█░█░█░█▀▄░█▀█░█░█░▀▀█░░░░
#░░░▀░▀░▀▀▀░▀▀▀░▀▀▀░▀▀▀░▀░▀░▀░▀░▀░▀░▀▀▀░░░░

# The hologram plugin used to create holograms (DecentHolograms, FancyHolograms)
preferred-hologram-provider: FancyHolograms

# The default hologram view distance, can be overridden inside individual holograms
hologram-view-distance: 15

# Define custom hologram styles and reuse them anywhere. [1.19.4+ only]
hologram-styles:
  default:
    view-distance: 15
#   update: 3s
    see-through: false # See hologram through blocks
    billboard: vertical # fixed, vertical, horizontal, center
    alignment: center # center, left, right
    brightness: 15 # from 0 to 15
#   background-color: { red: 0, green: 0, blue: 0 } # Better system is coming
    scale: x=1 y=1 z=1
    shadow: none #strength=1 radius=1
#   background-color: { red: 0, green: 0, blue: 0 } # [Text-only] Better system is coming
#   update: 3s   # [Text-only]


#░░░▀█▀░▀█▀░█▀▀░█▄█░░░█▀▄░█▀▄░█▀█░█▀█░█▀▀░░░░
#░░░░█░░░█░░█▀▀░█░█░░░█░█░█▀▄░█░█░█▀▀░▀▀█░░░░
#░░░▀▀▀░░▀░░▀▀▀░▀░▀░░░▀▀░░▀░▀░▀▀▀░▀░░░▀▀▀░░░░
# Configuration for dropItem, dropItemAtBlock, dropItemAtPlayer, dropItemAtMob, dropItemAtAttackers, dropItemAtCoords actions

# The default drop location for the dropItem action. Possible values: block or player
default-item-drop-target: block

# Whether silk touch should be allowed to affect drops
silk-touch: true

# Drops affected by the silk touch enchant.
silk-touch-items:
  coal: coal_ore
  diamond: diamond_ore
  emerald: emerald_ore
  raw_iron: iron_ore
  raw_gold: gold_ore
  lapis_lazuli: lapis_ore
  quartz: nether_quartz_ore
  redstone: redstone_ore
# raw_copper: copper_ore             # 1.17+
# amethyst_shard: amethyst_cluster   # 1.17+

# Whether fortune should be allowed to affect item drops
fortune: true

# Drops affected by the Fortune enchant.
apply-fortune:
  - coal
  - diamond
  - emerald
  - lapis_lazuli
  - redstone
  - quartz
  - raw_iron
  - raw_gold
# - raw_copper   # 1.17+
# - dirt         # Supports any item type

# Whether looting enchant should be allowed to affect item drops
looting: true

# Drops affected by the Looting enchant.
apply-looting:
  - bone
  - rotten_flesh
  - string
  - gunpowder
  - spider_eye
  - slime_ball
  - magma_cream
  - blaze_rod
  - ghast_tear
  - ender_pearl
  - prismarine_shard
  - prismarine_crystals
  - ink_sac
  - glowstone_dust
  - gold_nugget
  - iron_nugget
  - leather
  - rabbit_hide
  - rabbit_foot
  - feather
  - chicken
  - beef
  - porkchop
  - mutton
  - rabbit
  - cod
  - salmon

# Whether auto-smelt should be allowed to affect item drops
auto-smelt: true

# AutoSmelt enchant aliases. (Based on the enchantment plugin you use it might be different)
auto-smelt-aliases:
  - autosmelt # EcoEnchants, CrazyEnchantments
  - infernal_touch # EcoEnchants
  - auto-smelt
  - smelter # ExcellentEnchants
  - smelting # AdvancedEnchantments

# Drops affected by the auto-smelt enchant from the player's tool.
smeltable-items:
  raw_iron: iron_ingot
  raw_gold: gold_ingot
#  raw_copper: copper_ingot   # 1.17+
#  dirt: diamond              # Supports any item type

# The chance to smelt an item based on the enchant level.
smelt-chance-by-level:
  1: 20%
  2: 40%
  3: 60%
  4: 80%
  5: 100%

# Whether telepathy should be allowed to affect item drop
telepathy: true

# Telepathy enchant aliases. (Based on the enchantment plugin you use it might be different)
telepathy-aliases:
  - telepathy # AdvancedEnchantments, CrazyEnchantments
  - telekinesis # ExcellentEnchants

# The chance drops are added directly to your inventory based on the enchant level.
telepathy-chance-by-level:
  1: 30%
  2: 70%
  3: 100%

# Whether mining fortune stat should be allowed to affect item drops
# +0-100% chance of +1 drop every 0-100 stat levels (i.e. 400 mining fortune = 100% for +4 drops)
mining-fortune: true

# Drops affected by the Mining Fortune Stat of the player.
apply-mining-fortune:
  - coal
  - diamond
  - emerald
  - lapis_lazuli
  - redstone
  - quartz
  - raw_iron
  - raw_gold
# - raw_copper   # 1.17+

#░░░█▀▀░█░█░█▀█░░░█▀▄░█▀▄░█▀█░█▀█░█▀▀░░░░
#░░░█▀▀░▄▀▄░█▀▀░░░█░█░█▀▄░█░█░█▀▀░▀▀█░░░░
#░░░▀▀▀░▀░▀░▀░░░░░▀▀░░▀░▀░▀▀▀░▀░░░▀▀▀░░░░
# Compatible actions: giveExp, dropExpAtPlayer, dropExpAtBlock, dropExp.

# Whether experience should be enabled by default when using exp spawn/give actions
# If set to false you will have to manually set the `experience` flag to true in each action
experience: true

# Experience enchant aliases. (Based on the enchantment plugin you use it might be different)
experience-aliases:
  - experience # AdvancedEnchantments, CrazyEnchantments
  - lucky_miner # ExcellentEnchants

# The exp multiplier based on the enchant level
exp-multiplier-by-level:
  1: 1.0-1.2
  2: 1.4
  3: 1.6
  4: 1.8
  5: 2


#░░░█▀▀░▀█▀░█▀▄░█░█░█▀▀░▀█▀░█░█░█▀▄░█▀▀░░░█░█░█▀▀░█▀█░█░░░▀█▀░█░█░░░░
