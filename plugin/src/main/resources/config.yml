# Modules: items, messages, particles, sounds, menus, recipes, functions, structures,
#     generators, gates, collections, mobs, stats, skills, commands.

# Toggle modules that should be disabled. Once a module is disabled you can delete the respective config folder.
disabled-modules: []


#░░░█▀▀░█▀█░█▄█░█▀▀░█▀█░█░░░█▀█░█░█░░
#░░░█░█░█▀█░█░█░█▀▀░█▀▀░█░░░█▀█░░█░░░
#░░░▀▀▀░▀░▀░▀░▀░▀▀▀░▀░░░▀▀▀░▀░▀░░▀░░░
# Hunger Default Configuration Summary: Player food bars are always full and never run out, food level
# does not regen health because the health is already regenerated through health-regen stat.

# Show death messages when a player dies for any reason except being killed by a custom mob
show-death-messages: true

# Show death messages when a player is slain by a custom mob
show-slain-messages: true

# How long the player remains in combat after fighting another entity.
in-combat-duration: 10-15s

# How often health regeneration is attempted.
# Set to 'none' to disable health regeneration entirely.
health-regen-interval: 2s

# How often mana regeneration is attempted.
# Set to 'none' to disable mana regeneration entirely.
mana-regen-interval: 1s

# Whether health should regenerate while in combat
regen-health-during-combat: false

# Whether mana should regenerate while in combat
regen-mana-during-combat: true

# Whether the player's hunger bar should deplete over time from normal actions
# (sprinting, jumping, attacking, mining, healing, etc.)
hunger-depletion: false

# Whether players naturally regenerate health from eating or having sufficient hunger/saturation
# Does not affect Peaceful-mode regen, potions, golden apples, or other healing sources.
hunger-health-regen: false

# Multiplier applied to the exhaustion gained from every action.
# 100% = vanilla speed, 50% = half as fast (hunger drains slower), 200% = twice as fast.
exhaustion-multiplier: 70%

# The highest value the hunger bar can reach.
# When depletion is disabled, this is also the fixed value the bar is locked at.
hunger-cap: 20

# The highest saturation value achievable.
# When depletion is disabled, this is also the fixed value saturation is locked at.
saturation-cap: 20

# Whether the custom cow milking system should be enabled
custom-cow-milking: true

# How many times a cow can be milked before it runs out
cow-max-milk: 3

# How frequently a cow should produce milk
milk-production: 1 milk every 20-40s

# Whether the custom egg laying system should be enabled
custom-egg-laying: true

# How frequently a chicken should lay eggs
egg-laying: 1 egg every 20-40s

# Triggered when a player damages an entity
on-player-damage-entity:
  - sendHologram &c-{damage}$heart offsetY=1 rangeX=0.7 rangeY=0.4 rangeZ=0.7 duration=0.5s


