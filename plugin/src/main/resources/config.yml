# The default skill settings. Can be overridden inside any /skills/ YML file
default-skill-settings:
  # The max skill level
  max-level: 100

  # The skill exp curve formula
  exp-formula: "(level/0.1)^2"   # Table: https://docs.google.com/spreadsheets/d/1uKtb0TNpGUDe4uaNQHuicAinahdi_w2OhySmgF2Ibk0/edit?usp=sharing

  # The function triggered when a player earns exp for any skill
  on-exp-earn:
    - sendActionBar &a+{exp} {skill_tc} exp

# The default skill progress bar for some placeholders
skill-progress-bar: line

# Config shortcuts, these placeholders can be used in all configurations and
# will be replaced by the specified value. This way you can avoid typing weird characters and waste time.
skill-config-shortcuts:
  $health: '&c❤ Health'
  $defense: '&a❈ Defense'
  $damage: '&c❁ Damage'
  $mana: '&b✎ Mana'
  $mining_fortune: '&6☘ Mining Fortune'
  $mining_speed: '&6⛏ Mining Speed'
  $farming_fortune: '&6☘ Farming Fortune'
  $foraging_fortune: '&6☘ Foraging Fortune'
  $strength: '&c❁ Strength'
  $intelligence: '&b✎ Intelligence'

# EXP Earning Activities Guidelines
# Target: Level 1 -> 100 (1,000,000 exp) in ~90 hours average
# Examples
# |                 Description                     |  Activity  |
# |           stone readily available               |   basic    |
# |  wheat farm that regrows 1-3 every few seconds  |   common   |
# |     diamond ores placed scarcely in a cave      |    epic    |

# Exp earnings per activity duration (Different factors affect duration: walk distance, regrowth/respawn rate, etc...)
# |    Name    |       Duration      | exp/sec | reach lvl 100 | bonus |
# |    basic   |        instant      |  2.00   |  138.8+ hours |  +0%  |
# |   common   |      <1 second      |  2.00   |  138.8 hours  |  +0%  |
# |  uncommon  |     1-2 seconds     |  2.50   |  111.1 hours  | +25%  |
# |    rare    |     2-4 seconds     |  3.00   |  92.59 hours  | +50%  |
# |    epic    |     4-8 seconds     |  3.50   |  79.37 hours  | +75%  |
# |  legendary |    16-32 seconds    |  4.00   |  69.44 hours  | +100% |

# Exp activities are entirely optional, just define exp amount instead of exp activity name.
exp-earning-activities:
  basic: 1 exp chance=25%
  common: 1-2 exp
  uncommon: 2-5 exp
  rare: 6-12 exp
  epic: 14-28 exp
  legendary: 64-128 exp


