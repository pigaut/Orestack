# Default lore generation (Useful to avoid writing lore manually)
default-item-lore:
  - '{item_breaking_power}'
  - '{item_stats}'
  - '{item_description}'
  - '{item_enchants}'
  - '{item_abilities}'
  - '{item_rarity}'

# The header before an item placeholder
item-placeholder-headers: {}

# The divider for an item placeholder that has multiples elements: enchants, abilities, stats
item-placeholder-dividers:
  item_enchants: ['']
  item_abilities: ['']

# The footer after an item placeholder
item-placeholder-footers:
  item_breaking_power: ['']
  item_stats: ['']
  item_description: ['']
  item_enchants: ['']
  item_abilities: ['']

# The max elements before compression strategies are applied.
# Compression strategies: 1. Remove divider, 2. Remove extra description lines, 3. Inline multiple elements
item-placeholder-max-lines:
  item_stats: 10
  item_enchants: 10

# The default name when the item has no display name or rarity set
default-item-name: '&f{item_name_tc}'

# The default description color/formatting
default-description-color: '&7'

# Stat descriptions used by {item_stats}
stat-descriptions:
  default: ['&7{stat_name_tc}: &a+{stat_level}']
  # Base stats:
  damage: ['&7Damage: &c+{item_stat:damage}']
  defense: ['&7Defense: &a+{item_stat:defense}']
  max_health: ['&7Health: &a+{item_stat:max_health}']
  max_mana: ['&7Mana: &b+{item_stat:max_mana}']
  health_regen: ['&7Health Regen: &a+{item_stat:health_regen}/2 sec']
  mana_regen: ['&7Mana Regen: &b+{item_stat:mana_regen}/1 sec']
  crit_damage: ['&7Crit Damage: &a+{item_stat:crit_damage}%']
  crit_chance: ['&7Crit Chance: &a+{item_stat:crit_chance}%']
  exp-gain: ['&7Exp Gain: &e+{item_stat:exp_gain}%']
  mining_fortune: ['&7Mining Fortune: &a+{item_stat:mining_fortune}']
  farming_fortune: ['&7Farming Fortune: &a+{item_stat:farming_fortune}']
  foraging_fortune: ['&7Foraging Fortune: &a+{item_stat:foraging_fortune}']
  movement_speed: ['&7Speed: &a+{item_stat:movement_speed}']
  attack_speed: ['&7Attack Speed: &a+{item_stat:attack_speed}']
  mining_speed: ['&7Mining Speed: &a+{item_stat:mining_speed}']
  # Custom stats:
  intelligence: ['&7Intelligence: &a+{item_stat:intelligence}']
  strength: ['&7Strength: &c+{item_stat:strength}']
  digging-speed: ['&7Digging Speed: &a+{item_stat:digging_speed}']
  chopping-speed: ['&7Chopping Speed: &a+{item_stat:chopping_speed}']

# Settings for the {item_abilities} placeholder
# Add your own placeholders: {name}, {trigger}, {description}, {mana-cost}, {cooldown}, {anything_you_want}, etc...
ability-description-template:
  - '&6Ability: {name} &e&l{trigger_spu}' # spu = SPACED UPPERCASE
  - '&7{description}'
  - '&8Mana Cost: &b{mana_cost}$mana'
  - '&8Cooldown: &a{cooldown}'

# Whether breaking blocks should require breaking power
use-breaking-power: true

# The default player breaking power with no tool
default-breaking-power: 1 # Set to 0 and players will not be able to mine anything without a proper tool

# Item breaking powers and block power requirements, and display for {item_breaking_power} placeholder
# Breaking power is a number starting at 1 (Anything can mine it) and each level beyond requires a more powerful tool.
breaking-powers:
  mining-power:
    display: '&8Mining Power {amount_rm}'
    # Triggered when the player tool does not have mining power
    on-wrong-tool: # Placeholders: {tool_breaking_power}, {block_breaking_power}
      - sendChat &cYou need a pickaxe to mine ores
    # Triggered when the player tool doesn't have enough breaking power
    on-insufficient-power: # Placeholders: {tool_breaking_power}, {block_breaking_power}
      - sendChat &cYou need a pickaxe with &8Mining Power {block_mining_power_rm} &cto mine this ore
    block-requirements:
      coal_ore: 1 power
      copper_ore: 2 power
      gold_ore: 3 power
      iron_ore: 3 power
      diamond_ore: 4 power
      emerald_ore: 5 power
      ancient-debris: 5 power
      items-adder:ruby_ore: 6 power # items-adder (ia), nexo (nx), craft-engine (ce)

  chopping-power:
    display: '&8Chopping Power {amount_rm}'
    on-wrong-tool:
      - sendChat &cYou need an axe to chop wood
    on-insufficient-power:
      - sendChat &cYou need an axe with &8Chopping Power {tool_chopping_power_rm} &cto chop this tree
    block-requirements:
      # Breaking power of 1 means any tool or empty hand can mine it.
      raw_oak: 1 power # raw_oak includes: oak_log, oak_wood
      raw_birch: 2 power
      raw_spruce: 2 power

  digging-power:
    display: '&8Digging Power {amount_rm}'
    on-wrong-tool:
      - sendChat &cYou need a shovel to dig blocks
    on-insufficient-power:
      - sendChat &cYou need a shovel with &8Digging Power {tool_digging_power_rm} &cto dig this block
    block-requirements:
      sand: 2 power
      red_sand: 3 power

