# Configuration for dropItem, dropItemAtBlock, dropItemAtPlayer, dropItemAtMob, dropItemAtAttackers, dropItemAtCoords actions

# The default drop location for the dropItem action. Possible values: block or player
default-item-drop-target: block

# Whether silk touch should be allowed to affect drops
silk-touch: true

# Drops affected by the silk touch enchant.
silk-touch-items:
  coal: coal_ore
  diamond: diamond_ore
  emerald: emerald_ore
  raw_iron: iron_ore
  raw_gold: gold_ore
  lapis_lazuli: lapis_ore
  quartz: nether_quartz_ore
  redstone: redstone_ore
  raw_copper: copper_ore # 1.17+
  amethyst_shard: amethyst_cluster # 1.17+

# Whether fortune should be allowed to affect item drops
fortune: true

# Drops affected by the Fortune enchant.
apply-fortune:
  - coal
  - diamond
  - emerald
  - lapis_lazuli
  - redstone
  - quartz
  - raw_iron
  - raw_gold
  - raw_copper # 1.17+

# Whether looting enchant should be allowed to affect item drops
looting: true

# Drops affected by the Looting enchant.
apply-looting:
  - bone
  - rotten_flesh
  - string
  - gunpowder
  - spider_eye
  - slime_ball
  - magma_cream
  - blaze_rod
  - ghast_tear
  - ender_pearl
  - prismarine_shard
  - prismarine_crystals
  - ink_sac
  - glowstone_dust
  - gold_nugget
  - iron_nugget
  - leather
  - rabbit_hide
  - rabbit_foot
  - feather
  - chicken
  - beef
  - porkchop
  - mutton
  - rabbit
  - cod
  - salmon

# Whether auto-smelt should be allowed to affect item drops
auto-smelt: true

# AutoSmelt enchant aliases. (Based on the enchantment plugin you use it might be different)
auto-smelt-aliases:
  - autosmelt # EcoEnchants, CrazyEnchantments
  - infernal_touch # EcoEnchants
  - auto-smelt
  - smelter # ExcellentEnchants
  - smelting # AdvancedEnchantments

# Drops affected by the auto-smelt enchant from the player's tool.
smeltable-items:
  raw_iron: iron_ingot
  raw_gold: gold_ingot
  raw_copper: copper_ingot # 1.17+
#  dirt: diamond # Supports any item type

# The chance to smelt an item based on the enchant level.
smelt-chance-by-level:
  1: 20%
  2: 40%
  3: 60%
  4: 80%
  5: 100%

# Whether telepathy should be allowed to affect item drop
telepathy: true

# Telepathy enchant aliases. (Based on the enchantment plugin you use it might be different)
telepathy-aliases:
  - telepathy # AdvancedEnchantments, CrazyEnchantments
  - telekinesis # ExcellentEnchants

# The chance drops are added directly to your inventory based on the enchant level.
telepathy-chance-by-level:
  1: 30%
  2: 70%
  3: 100%

# Whether mining fortune stat should be allowed to affect item drops
# +0-100% chance of +1 drop every 0-100 stat levels (i.e. 400 mining fortune = 100% for +4 drops)
mining-fortune: true

# Drops affected by the Mining Fortune Stat of the player.
apply-mining-fortune:
  - coal
  - diamond
  - emerald
  - lapis_lazuli
  - redstone
  - quartz
  - raw_iron
  - raw_gold
  - raw_copper # 1.17+

