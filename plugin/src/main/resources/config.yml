# Shortcuts let you define reusable YAML values once and reference them
# anywhere in this plugin's config files, instead of copy and pasting
# text/symbols repeatedly.

# Whether shortcuts should be enabled
shortcuts: true

# Generic shortcuts, that do not belong to any module.
generic-config-shortcuts:
  # Stars
  $star: ★
  $star-outline: ☆
  $sparkle: ✦
  $sparkle-outline: ✧

  # Arrows
  $arrow-right: ➜
  $arrow-left: ⬅
  $arrow-up: ⬆
  $arrow-down: ⬇
  $arrow-double: »

  # Status / feedback
  $check: ✔
  $cross: ✘
  $warning: ⚠
  $info: ℹ

  # Combat / stats
  $heart: '❤'
  $protect: '❈'
  $pencil: '✎'
  $clover: '☘'
  $power: '❁'
  $pickaxe: '⛏'
  $sword: ⚔
  $shield: 🛡
  $skull: ☠
  $bolt: ⚡
  $droplet: 💧

  # Currency / economy
  $coin: ⛁
  $gem: ♦

  # Bullets & separators
  $bullet: •
  $dot: ·
  $divider: ─
  $divider-bold: ━
  $pipe: │

  # Brackets / decorative
  $corner-left: ❮
  $corner-right: ❯
  $diamond: ◆
  $square: ■
  $circle: ●

  # Misc useful symbols
  $infinity: ∞
  $degree: °
  $copyright: ©


