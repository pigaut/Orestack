# Whether to use the actionbar to show the status bar (health, defense, mana)
show-status-bar: true

# The status bar to show to the player
status-bar: '&c{player_health}/{player_max_health}$health    &a{player_defense}$defense    &b{player_mana}/{player_max_mana}$mana  '

# Whether action bar messages should be inserted into the status bar. Otherwise, the message will replace the status bar.
insert-messages-in-status-bar: true

# Settings for status bar messages
status-bar-messages:
  length: 18
  duration: 3s
  align: center   # left, center, right

# The base player stats
base-stats:
  damage: 1
  defense: 1
  max-health: 100
  max-mana: 100
  health-regen: 3 every 2s # Regen interval can only be changed here and will be the same for all players.
  mana-regen: 2 every 1s # Regen interval can only be changed here and will be the same for all players.
  crit-damage: 50%
  crit-chance: 30%
  mining_fortune: 0
  farming_fortune: 0
  foraging_fortune: 0
  movement_speed: 0
  attack_speed: 0
  mining_speed: 0

# The custom player stats
custom-stats:
  strength:
    base: 0 # The base level
    stats: # Custom stats work by incrementing other base stats
      damage: +1 every 1 level
      crit-damage: +1% every 1 level
      crit-chance: +0.1% every 1 level

  intelligence:
    base: 0
    stats:
      max-mana: +1 every 1 level
      mana-regen: +1 every 50 levels


# How long the player remains in combat after fighting another entity.
in-combat-duration: 10-15s

# Whether health should regenerate while in combat
regen-health-during-combat: false

# Whether mana should regenerate while in combat
regen-mana-during-combat: true

#░░░█▀▀░█▀█░█▀▀░█░█░█▀█░█▀█░▀█▀░░░█▀▀░▀█▀░█▀█░▀█▀░█▀▀░░░░
#░░░█▀▀░█░█░█░░░█▀█░█▀█░█░█░░█░░░░▀▀█░░█░░█▀█░░█░░▀▀█░░░░
#░░░▀▀▀░▀░▀░▀▀▀░▀░▀░▀░▀░▀░▀░░▀░░░░▀▀▀░░▀░░▀░▀░░▀░░▀▀▀░░░░
# Customize whether some enchants should increment stats instead of their vanilla functionality.

# Whether the sharpness enchant should be treated as a stat multiplier.
sharpness-enchant-as-stat: true

# The damage multiplier by sharpness enchant level.
damage-multiplier-by-sharpness-enchant-level:
  1: 5%
  2: 10%
  3: 15%
  4: 20%
  5: 30%

# Whether the efficiency enchant should be treated as a stat increment.
efficiency-enchant-as-stat: true

# Set the Mining Speed amount gained by the items efficiency enchant level.
mining-speed-by-efficiency-enchant-level:
  1: 20
  2: 40
  3: 60
  4: 80
  5: 100

# Whether the fortune enchant should be treated as a stat increment.
fortune-enchant-as-stat: true

# Set the Mining Fortune amount gained by the items fortune enchant level.
mining-fortune-by-fortune-enchant-level:
  1: 30
  2: 60
  3: 90
  4: 120


