# Functions for sending messages with different condition requirements.

# Sends a collection tier up message based on
# whether: first tier or not / has rewards or not.
sendCollectionTierUpMessage:
  if: collectionTierEquals 1
  then:
    if: collectionHasRewards
    do:
      - sendMessage collection-first-level-up
    or:
      - sendMessage collection-first-level-up-no-rewards

  # Send collection level up message for tier 2 and above
  else:
    if: collectionHasRewards
    do:
      - sendMessage collection-level-up
    or:
      - sendMessage collection-level-up-no-rewards


# Sends a skill level up message based on
# whether: first level or not / has rewards or not.
sendSkillLevelUpMessage:
  if: skillLevelEquals 0
  then:
    if: skillHasRewards
    do:
      - sendMessage skill-first-level-up
    or:
      - sendMessage skill-first-level-up-no-rewards

  # Send skill level up message for level 1 and above
  else:
    if: skillHasRewards
    do:
      - sendMessage skill-level-up
    or:
      - sendMessage skill-level-up-no-rewards