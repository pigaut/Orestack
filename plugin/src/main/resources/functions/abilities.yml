
# Attempts to slash all enemies in front.
# The protagonist is either a mob or a player, both can use this ability.
flameSlash:
  - do:
      - spawnParticleAtProtagonist flame_slash # Found in: particles/abilities/slash.yml
      - playSoundAtProtagonist entity_player_hurt_on_fire

  - for-each: entity_in_front length=3 width=6
    do: damageEntity 5-10


instantTransmission:
  - if: hasCooldown instant_transmission
    do:
      - sendMessage ability_on_cooldown # Found in: messages/abilities.yml
      - return

  - if-not: hasMana 30
    do:
      - sendMessage not_enough_mana # Found in: messages/abilities.yml
      - return

  - do:
      - consumeMana 30
      - teleportForward 12
      - startCooldown instant_transmission duration=1s
      - playSoundAtPlayer entity_enderman_teleport
