
type: slime
size: 2

name: '&2Slime'
health: 15
speed: 0.18
deal-damage: false # The mob will attack but deal no damage or knockback
slime-split: false

slain-message: '&cA {mob_name_tc}&c stomped {player_tc} to death.'

exp: 20-40

# [Paper Only]
on-jump: []

# [Paper Only]
on-land:
  # Spawn green dust particle
  - do: spawnParticleAtMob green_dust_cloud

  # Damage every entity in range
  - for-each: entity_in_range range=2.5 limit=3
    do: damageEntity 1-2

on-death:
  - dropItemAtLastDamager slime_ball amount=2-4