#░░░▀░▀░▀▀▀░▀▀▀░▀░▀░▀▀▀░▀░▀░░▀░░░░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀▀▀░░

# The item for {skill_icon} placeholder
icon: brewing_stand

# The skill description for {skill_description} placeholder
description:
  - 'Brew potions to earn Alchemy EXP!'

# Triggered when a player collects a brewed potion from a brewing stand
brew-potion-exp:
  switch: itemPotionTypeEquals
  cases:
    awkward: common exp # Exp earning activity or exp amount (i.e. 100 exp, 10-20 exp)
    fire_resistance: uncommon exp
    harming: rare exp
    healing: rare exp
    infested: uncommon exp
    invisibility: uncommon exp
    leaping: common exp
    luck: legendary exp
    mundane: basic exp
    night_vision: common exp
    oozing: uncommon exp
    poison: common exp
    regeneration: uncommon exp
    slow_falling: uncommon exp
    slowness: common exp
    strength: uncommon exp
    swiftness: common exp
    thick: basic exp
    turtle_master: rare exp
    water: basic exp
    water_breathing: uncommon exp
    weakness: basic exp
    weaving: uncommon exp
    wind_charged: uncommon exp

    # Long duration variants
    long_fire_resistance: uncommon exp
    long_invisibility: uncommon exp
    long_leaping: common exp
    long_night_vision: common exp
    long_poison: common exp
    long_regeneration: uncommon exp
    long_slow_falling: uncommon exp
    long_slowness: common exp
    long_strength: uncommon exp
    long_swiftness: common exp
    long_turtle_master: rare exp
    long_water_breathing: uncommon exp
    long_weakness: basic exp

    # Strong effect variants
    strong_harming: epic exp
    strong_healing: epic exp
    strong_leaping: uncommon exp
    strong_poison: uncommon exp
    strong_regeneration: rare exp
    strong_slowness: uncommon exp
    strong_strength: rare exp
    strong_swiftness: uncommon exp
    strong_turtle_master: epic exp
  default: 0 exp


--- # ===== Levels 1-10 ===== #
levels: 1-10

stats:
  intelligence: +1 every 1 level

rewards:
  - '&8+&a1 $intelligence'
  - '&8+&e5,000 $coin Coins'

on-completion:
  - giveMoney 5000

