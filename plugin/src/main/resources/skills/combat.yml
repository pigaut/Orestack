# The item for {skill_icon} placeholder
icon: stone_sword

# The skill description for {skill_description} placeholder
description:
  - 'Fight mobs and special bosses to'
  - 'to earn Combat EXP!'

entity-kill-exp:
  - if: entityIsMob # Whether entity is a custom RpgMaker Mob
    then:
      switch: mobNameEquals # Test the mob name (i.e. mobs/boar.yml = boar)
      cases:
        slime: common exp
        boar: common exp
        zombie: uncommon exp
      default: 0 exp

  - switch: entityTypeEquals
    cases:
      zombie: common exp
      spider: common exp
    default: 0 exp

--- # ===== Levels 1-10 ===== #
levels: 1-10
stats:
  damage: +1% every 1 level
  crit-chance: +0.1% every 1 level
rewards:
  - '&8+&a1% $damage'
  - '&8+&b0.1% $crit-chance'
  - '&8+&e5,000 $coin Coins'
on-completion:
  - giveMoney 5000

