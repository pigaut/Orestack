#░░░▀░░░▀░▀░▀░▀░▀░▀░▀▀▀░▀░▀░▀▀▀░░░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀▀▀░░

# The skill icon item
icon: gold_hoe

# The skill description
description:
  - 'Harvest crops, milk cows,'
  - 'collect eggs, and shear sheep'
  - 'to earn Farming EXP!'

# The exp gained when a player collects an egg laid by a chicken
egg-collect-exp:
  yield: 10 exp

# The exp gained when a player milks a cow
milk-cow-exp:
  if: hasPermission double.milking.exp
  yield: 40 exp
  else: 20 exp

# The exp gained when a player shears a sheep
sheep-shear-exp:
  - if: hasPermission triple.shearing.exp
    yield: 90 exp

  - if: hasPermission double.shearing.exp
    yield: 60 exp

  - yield: 30 exp


# The exp gained when a player breaks a block
block-break-exp:
  switch: blockTypeEquals
  cases:
    wheat: common exp
    carrots: common exp
    potatoes: common exp
    beetroot: uncommon exp
    melon: rare exp
    pumpkin: rare exp
    sugar_cane: uncommon exp
    cactus: uncommon exp
    bamboo: rare exp
    cocoa: rare exp
    nether_wart: epic exp
    vine: common exp
    twisting_vines: epic exp
    weeping_vines: epic exp
    moss_block: uncommon exp # 1.17+
    mangrove_propagule: rare exp # 1.17+
    pitcher_crop: legendary exp # 1.20+
    torchflower_crop: legendary exp # 1.20+
  default: 0 exp

--- # ===== Levels 1-10 ===== #
levels: 1-10

stats:
  max-health: +1 every 1 level
  farming-fortune: +4 every 1 level

rewards:
  - '&8+&a1 $health'
  - '&8+&64 $farming_fortune'
  - '&8+&e5,000 $coin Coins'

on-completion:
  - giveMoney 5000

