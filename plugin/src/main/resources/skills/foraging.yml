# The item for {skill_icon} placeholder
icon: jungle_sapling

# The skill description for {skill_description} placeholder
description:
  - 'Cut down trees and forage for other'
  - 'plants to earn Foraging EXP!'

# The exp gained when a player breaks a block
block-break-exp:
  switch: blockTypeEquals
  cases:
    raw_oak: common exp # Exp earning activities can be found in config.yml and help you stay consistent.
    raw_birch: uncommon exp # raw_birch includes: birch_log, birch_wood
    raw_spruce: uncommon exp
    raw_jungle: common exp
    raw_dark_oak: common exp
    raw_acacia: legendary exp
    raw_mangrove: rare exp # 1.19+
    mangrove_roots: uncommon exp # 1.19+
    raw_cherry: rare exp # 1.21+
    raw_pale_oak: legendary exp # 1.21+
  default: 0 exp

--- # ===== Levels 1-10 ===== #
levels: 1-10

stats:
  strength: +1 every 1 level
  foraging-fortune: +4 every 1 level

rewards:
  - '&8+&a1 $strength'
  - '&8+&64 $foraging_fortune'
  - '&8+&e5,000 $coin Coins'

on-completion:
  - giveMoney 5000

