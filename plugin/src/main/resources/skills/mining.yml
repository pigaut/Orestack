# The item for {skill_icon} placeholder
icon: iron_pickaxe

# The skill description for {skill_description} placeholder
description:
  - 'Mine ores and blocks to'
  - 'earn Mining EXP!'

block-break-exp:
  switch: blockTypeEquals
  cases:
    # Sub statements example
    stone:
      if: hasPermission common.stone.exp
      yield: 1-2 exp
      else: basic exp

    # Basic stone-type blocks
    cobblestone: basic exp
    andesite: basic exp
    diorite: basic exp
    granite: basic exp
    tuff: basic exp
    calcite: basic exp
    deepslate: basic exp
    cobbled_deepslate: basic exp
    netherrack: basic exp
    end_stone: basic exp
    blackstone: basic exp
    basalt: basic exp
    obsidian: epic exp
    crying_obsidian: legendary exp

    # Coal
    coal_ore: common exp
    deepslate_coal_ore: common exp
    coal_block: uncommon exp

    # Copper
    copper_ore: common exp
    deepslate_copper_ore: common exp
    raw_copper_block: uncommon exp
    copper_block: uncommon exp

    # Iron
    iron_ore: uncommon exp
    deepslate_iron_ore: uncommon exp
    raw_iron_block: rare exp
    iron_block: rare exp

    # Gold
    gold_ore: rare exp
    deepslate_gold_ore: rare exp
    nether_gold_ore: uncommon exp
    raw_gold_block: rare exp
    gold_block: rare exp

    # Redstone
    redstone_ore: common exp
    deepslate_redstone_ore: common exp
    redstone_block: uncommon exp

    # Lapis
    lapis_ore: uncommon exp
    deepslate_lapis_ore: uncommon exp
    lapis_block: rare exp

    # Diamond
    diamond_ore: epic exp
    deepslate_diamond_ore: epic exp
    diamond_block: 100-200 exp

    # Emerald
    emerald_ore: legendary exp
    deepslate_emerald_ore: legendary exp
    emerald_block: 200-300 exp

    # Nether Quartz
    nether_quartz_ore: common exp

    # Ancient Debris / Netherite
    ancient_debris: legendary exp
    netherite_block: 300-400 exp

  default: 0 exp


--- # ===== Levels 1-10 ===== #
levels: 1-10

stats:
  defense: +1 every 1 level
  mining-fortune: +4 every 1 level

rewards:
  - '&8+&a1 $defense'
  - '&8+&64 $mining_fortune'
  - '&8+&e5,000 $coin Coins'

on-completion:
  - giveMoney 5000

