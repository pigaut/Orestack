
icon: iron_pickaxe

description:
  - 'Mine ores and blocks to'
  - 'earn Mining EXP!'

max-level: 100

exp-formula: "(floor(level - 1 + 300 * (2 ^ ((level - 1) / 7)))) / 4"

block-break-exp:
  switch: blockTypeEquals
  cases:
    dirt: 1
    cobblestone: 2
    coal_ore: 4
    diamond_ore:
      if-not: hasPermission double.diamond.exp
      return: 5
      else: 10
  default: 0

generator-harvest-exp:
  switch: generatorNameEquals
  cases:
    coal: 2
    gold: 4
  default: 0


--- # ===== Levels 1-25 ===== #
levels: 1-25

# Define the stat increment amount per level
stats:
  defense: +1 every 1 level
  mining-fortune: +4 every 1 level

rewards:
  - '&7+&a1 <defense>'
  - '&7+&a4 <mining_fortune>'

on-completion: []
on-regression: []

