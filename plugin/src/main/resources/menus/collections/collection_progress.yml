# Progress and rewards for any item collection. Supports up to 18 collection tiers.
# Usage: openMenu collection_progress collection=dirt

title: '&8{collection_name_tc} Collection'

rows: 6

layout:
  - "8 8 8 8 t 8 8 8 8"
  - "8 8 8 8 8 8 8 8 8"
  - "a b c d e f g h i"
  - "j k l m n o p q r"
  - "8 8 8 8 8 8 8 8 8"
  - "8 8 8 - X = 8 8 8"

--- #===== Collection Item =====#
id: t
type: '{collection_item}'
name: '&e{collection_name_tc} {collection_tier_rm}'
lore:
  - 'View all your {collection_name_tc} Collection'
  - 'progress and rewards!'
  - ''
  - 'Total Collected: &e{collection_amount}'

--- #===== Tier Button Template =====#
id: tier_template

template: true
args:
  - $ # The collection tier: [1, 2, 3, ..., 18]

amount: $ # Will be replaced with collection tier number
type: red_stained_glass_pane
name: '&c{collection_name_tc} {collection_tier_$_rm}'
lore:
  - ''
  - '&7Progress: &e{collection_tier_$_progress}%'
  - '{collection_tier_$_progress_bar} &e{collection_progress}&6/&e{collection_tier_$_amount_required}'
  - ''
  - '&7Rewards:'
  - '  {collection_tier_$_rewards}'

# Modify the button based on conditions (overrides default button)
modify:
  - if-not: collectionHasTier $
    clear: true # Whether to clear all previous button options
    type: gray_stained_glass_pane
    name: '&r'

  - if: collectionTierIsInProgress $
    type: yellow_stained_glass_pane
    name: '&e{collection_name_tc} {collection_tier_$_rm}'

  - if: collectionTierIsCompleted $
    type: lime_stained_glass_pane
    name: '&a{collection_name_tc} {collection_tier_$_rm}'

--- #===== Tier 1 =====#
id: a
template: tier_template
args:
  $: 1

