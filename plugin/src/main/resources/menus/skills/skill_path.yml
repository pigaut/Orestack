#░░░▀▀█░█▀▄░░█░░█░░░█░░░░░█▀▀░█▀█░░█░░█▀█░░░░
#░░░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀▀▀░░░▀░░░▀░▀░░▀░░▀░▀░░░░
# Progress and rewards for any skill. Supports up to 100 levels.
# Usage: openMenu skill_path skill=mining

type: atlas

title: '&7{skill_name_tc} Skill'

rows: 6

# Empty slots will display the underlying atlas canvas.
layout:
  - "_ _ _ _ _ _ _ _ _"
  - "_ _ _ _ _ _ _ _ _"
  - "_ _ _ _ _ _ _ _ _"
  - "_ _ _ _ _ _ _ _ _"
  - "_ _ _ _ _ _ _ _ _"
  - "< 8 8 - X = 8 8 >"

atlas:
  width: 41
  height: 6
  layout: # This layout uses 2 letter ids since there are many buttons.
    - "__ __ 05 06 07 __ 15 16 17 __ 25 26 27 __ 35 36 37 __ 45 46 47 __ 55 56 57 __ 65 66 67 __ 75 76 77 __ 85 86 87 __ 95 96 97"
    - "__ __ 04 __ 08 __ 14 __ 18 __ 24 __ 28 __ 34 __ 38 __ 44 __ 48 __ 54 __ 58 __ 64 __ 68 __ 74 __ 78 __ 84 __ 88 __ 94 __ 98"
    - "__ __ 03 __ 09 __ 13 __ 19 __ 23 __ 29 __ 33 __ 39 __ 43 __ 49 __ 53 __ 59 __ 63 __ 69 __ 73 __ 79 __ 83 __ 89 __ 93 __ 99"
    - "00 01 02 __ 10 11 12 __ 20 21 22 __ 30 31 32 __ 40 41 42 __ 50 51 52 __ 60 61 62 __ 70 71 72 __ 80 81 82 __ 90 91 92 __ 100"
    - "__ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __"
    - "__ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __ __"

--- # ===== Empty Slot ===== #
id: __
type: gray_stained_glass_pane

--- # ===== Scroll Left Button ===== #
id: '<'
type: arrow
name: '&8Scroll Left'
lore:
  - ''
  - '&eLeft-Click: &fTo scroll'
  - '&eRight-Click: &fGo to the beginning'

on-left-click: scrollLeft
on-right-click: scrollLeft 100

# Replace the button with gray glass if there is no more space to scroll left
replace:
  if-not: canScrollLeft
  type: gray_stained_glass_pane

--- # ===== Scroll Right Button ===== #
id: '>'
type: arrow
name: '&8Scroll Right'
lore:
  - ''
  - '&eLeft-Click: &fTo scroll'
  - '&eRight-Click: &fGo to the end'

on-left-click: scrollRight
on-right-click: scrollRight 100

# Replace arrow with gray glass if there is no more space to scroll right
replace:
  if-not: canScrollRight
  type: gray_stained_glass_pane

--- # ===== Skill Button ===== #
id: 00
type: '{skill_icon}'
name: '&a{skill_name_tc} Skill'
lore:
  - '&7{skill_description}'
  - ''
  - '&7Progress to Level {skill_next_level}: &e{skill_progress}&6%'
  - '{skill_progress_bar} &e{skill_exp}&6/&e{skill_exp_required}'
  - ''
  - '&8Increase your {skill_name_tc} Level to'
  - '&8unlock perks, bonuses, and more!'

--- # ===== Level Button Template ===== #
id: level_template
template: true
args:
  - $ # Skill Level (i.e. [1, 2, 3, ..., 98, 99, 100])

# Locked
type: red_stained_glass_pane
name: '&c{skill_name_tc} Level {skill_level_$}'
lore:
  - '&7Rewards:'
  - '  {skill_level_$_rewards}'
  - ''
  - '&c&lLOCKED'

modify:
  # In progress
  - if: skillLevelIsInProgress $
    type: yellow_stained_glass_pane
    name: '&e{skill_name_tc} Level {skill_level_$}'
    lore:
      - '&7Rewards:'
      - '  {skill_level_$_rewards}'
      - ''
      - '&7Progress: &e{skill_level_$_progress}&6%'
      - '{skill_level_$_progress_bar} &e{skill_exp}&6/&e{skill_level_$_exp_required}'

  # Unlocked
  - if: skillLevelIsCompleted $
    type: lime_stained_glass_pane
    name: '&a{skill_name_tc} Level {skill_level_$}'
    lore:
      - '&7Rewards:'
      - '  {skill_level_$_rewards}'
      - ''
      - '&a&lUNLOCKED'

