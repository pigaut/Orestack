# Collection tier up chat messages with clickable/hoverable text

# Unlock collection message (collect an item for the first time)
collection-unlocked:
  message: '&6&lCOLLECTION UNLOCKED <collection>'
  <collection>:
    text: '&e{collection_name_tc}' # tc: Title Case
    on-click: runCommand collection {collection_name}
    on-hover: showText &eClick to view

# Collection first tier up message (with rewards)
collection-first-level-up:
  message:
    - '&e&l--------------------------------------------'
    - '&6&lCOLLECTION LEVEL UP <collection>'
    - ''
    - '  &a&lREWARDS'
    - '    {collection_rewards}' # Each reward takes one line
    - '&e&l--------------------------------------------'
  <collection>:
    text: '&e{collection_name_tc} I'
    on-click: runCommand collection {collection_name}
    on-hover: showText &eClick to view


# Collection first tier up message (no rewards)
collection-first-level-up-no-rewards:
  message: '&6&lCOLLECTION LEVEL UP <collection>'
  <collection>:
    text: '&e{collection_name_tc} I'
    on-click: runCommand collection {collection_name}
    on-hover: showText &eClick to view

# Collection tier up message (with rewards)
collection-level-up:
  message:
    - '&e&l--------------------------------------------'
    - '&6&lCOLLECTION LEVEL UP <collection>'
    - ''
    - '  &a&lREWARDS'
    - '    {collection_rewards}'
    - '&e&l--------------------------------------------'
  <collection>:
    text: '&e{collection_name_tc} &8{collection_previous_tier_rm}&l→&e{collection_tier_rm}' # rm: IV (Roman numerals)
    on-click: runCommand collection {collection_name}
    on-hover: showText &eClick to view

# Collection tier up message (no rewards)
collection-level-up-no-rewards:
  message: '&6&lCOLLECTION LEVEL UP <collection>'
  <collection>:
    text: '&e{collection_name_tc} &8{collection_previous_tier_rm}&l→&e{collection_tier_rm}'
    on-click: runCommand collection {collection_name}
    on-hover: showText &eClick to view

