
# Message for gaining exp for a skill for the first time
skill-unlocked:
  - '&b&lSKILL UNLOCKED &3{skill_name_tc}'   # tc: Title Case

# Message for levelling up to the first level of a skill
skill-first-level-up:
  - '&3&l--------------------------------------------'
  - '&b&lSKILL LEVEL UP &3{skill_name_tc} I'
  - ''
  - '  &a&lREWARDS'
  - '    {skill_rewards}' # Each reward takes one line
  - '&3&l--------------------------------------------'

# Message for levelling up to the first level of a skill (no rewards)
skill-first-level-up-no-rewards:
  - '&b&lSKILL LEVEL UP &3{skill_name_tc} I'

# Message for levelling up a skill
skill-level-up:
  - '&3&l--------------------------------------------'
  - '&b&lSKILL LEVEL UP &3{skill_name_tc} &8{skill_previous_level_rm}&l→&3{skill_level_rm}' # rm: IV (Roman numerals)
  - ''
  - '  &a&lREWARDS'
  - '   {skill_rewards}'
  - '&3&l--------------------------------------------'

# Message for levelling up a skill (no rewards)
skill-level-up-no-rewards:
  - '&b&lSKILL LEVEL UP &3{skill_name_tc} &8{skill_previous_level_rm}&l→&3{skill_level_rm}'  # rm: IV (Roman numerals)