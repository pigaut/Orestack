
icon: jungle_sapling

description:
  - 'Cut down trees and forage for other'
  - 'plants to earn Foraging EXP!'

max-level: 100

exp-formula: "(floor(level - 1 + 300 * (2 ^ ((level - 1) / 7)))) / 4"

block-break-exp: []

generator-harvest-exp: []

