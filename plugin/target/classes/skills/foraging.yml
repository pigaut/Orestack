# The item for {skill_icon} placeholder
icon: jungle_sapling

# The skill description for {skill_description} placeholder
description:
  - 'Cut down trees and forage for other'
  - 'plants to earn Foraging EXP!'

# Triggered anytime a player levels up this skill
on-level-up:
  - sendSkillLevelUpMessage   # Found in functions/utils/MessageUtil.yml

# The exp gained when a player breaks a block
block-break-exp:
  switch: blockTypeEquals
  cases:
    oak_log: common exp   # Exp earning activities can be found in config.yml and help you stay consistent.
    oak_wood: common exp
    birch_log: uncommon exp
    birch_wood: uncommon exp
    spruce_log: uncommon exp
    spruce_wood: uncommon exp
    jungle_log: common exp
    jungle_wood: common exp
    dark_oak_log: common exp
    dark_oak_wood: common exp
    acacia_log: legendary exp
    acacia_wood: legendary exp
    # mangrove_log: rare exp   # 1.19+
    # mangrove_wood: rare exp   # 1.19+
    # mangrove_roots: uncommon exp   # 1.19+
    # muddy_mangrove_roots: uncommon exp   # 1.19+
    # cherry_log: rare exp   # 1.21+
    # cherry_wood: rare exp   # 1.21+
    # pale_oak_log: legendary exp   # 1.21+
    # pale_oak_wood: legendary exp   # 1.21+
  default: 0 exp

--- # ===== Levels 1-25 ===== #
levels: 1-25

# Define the stat increment amount per level
stats:
  strength: +1 every 1 level
  foraging-fortune: +4 every 1 level

rewards:
  - '&8+&a1 $strength'
  - '&8+&64 $foraging_fortune'

on-completion: []

