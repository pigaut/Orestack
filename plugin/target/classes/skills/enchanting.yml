# The item for {skill_icon} placeholder
icon: enchanting_table

# The skill description for {skill_description} placeholder
description:
  - 'Enchant items to earn Enchanting EXP!'

# Triggered anytime a player levels up this skill
on-level-up:
  - sendSkillLevelUpMessage   # Found in functions/utils/MessageUtil.yml

# The exp when a player enchants an item.
item-enchant-exp:
  for-each: enchant_added
  switch: enchantEquals
  cases:
    unbreaking lvl=1: 50 exp
    unbreaking lvl=2: 100 exp
    unbreaking lvl=3+: 150 exp

--- # ===== Levels 1-25 ===== #
levels: 1-25

# Define the stat increment amount per level
stats:
  intelligence: +1 every 1 level

rewards:
  - '&8+&a1 $intelligence'

on-completion: []

