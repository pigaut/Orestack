
icon: gold_hoe

description:
  - 'Harvest crops, milk cows,'
  - 'collect eggs, and shear sheep'
  - 'to earn Farming EXP!'

max-level: 100

exp-formula: "(floor(level - 1 + 300 * (2 ^ ((level - 1) / 7)))) / 4"

block-break-exp: []

generator-harvest-exp: []

