# The item for {skill_icon} placeholder
icon: iron_pickaxe

# The skill description for {skill_description} placeholder
description:
  - 'Mine ores and blocks to'
  - 'earn Mining EXP!'

# Triggered anytime a player levels up this skill
on-level-up:
  - sendSkillLevelUpMessage   # Found in "functions/utils/MessageUtil.yml"

# The exp gained when a player breaks a block
block-break-exp:
  switch: blockTypeEquals
  cases:
    dirt: basic exp   # Exp earning activities can be found in config.yml and help you stay consistent.
    stone: basic exp
    cobblestone: basic exp
    coal_ore: common exp
    iron_ore: uncommon exp
    gold_ore: rare exp
    diamond_ore:
      if: hasPermission extra.diamond.exp
      return: 100 exp
      else: epic exp
    emerald_ore: legendary exp
    diamond_block: 100-200 exp
  default: 0 exp


--- # ===== Levels 1-25 ===== #
levels: 1-25

# Define the stat increment amount per level
stats:
  defense: +1 every 1 level
  mining-fortune: +4 every 1 level

rewards:
  - '&8+&a1 $strength'
  - '&8+&64 $foraging_fortune'

on-completion: []

